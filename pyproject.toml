[project]
name = "learn-you-an-sft"
version = "0.1.0"
description = "Fine-tune Qwen3-4B-Instruct into a persona via LoRA SFT on a Gemini-distilled corpus."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
  "ftfy>=6.1",
  "datasketch>=1.6",
  "pandas>=2.0",
  "tqdm>=4.65",
  "google-genai>=1.0",
  "python-dotenv>=1.0",
  "anthropic>=0.30",
  "instructor>=1.6",
  "pydantic>=2.0",
  "torch>=2.5.1",
  "transformers>=4.51",
  "tokenizers>=0.15",
  "datasets>=2.14",
  "accelerate>=0.30",
  "safetensors>=0.4",
  "peft>=0.11",
  "trl>=0.9",
  "bitsandbytes>=0.43; sys_platform == 'linux'",
  "ruff",
  "black",
  "mypy",
  "pytest",
  "fasttext-numpy2>=0.10.4",
  "tensorboard>=2.20.0",
  "runpod>=1.9.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["prep*", "run*"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
